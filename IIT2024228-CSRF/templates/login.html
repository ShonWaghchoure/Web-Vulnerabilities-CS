<!doctype html>
<html>
<head>
  <title>Demo Bank — Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <span class="brand">Demo Bank</span>
    <span class="env">local · transfer-console</span>
  </div>
  <div class="wrap">
    <div class="panel">
      <h1>Sign in</h1>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="POST" action="/login">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="alice" autocomplete="off">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="off">
        </div>
        <button type="submit">Sign in</button>
      </form>
      <p class="hint">Demo accounts for this exercise — alice / alice123, or bob / bob123.</p>
    </div>
  </div>
</body>
</html>
