<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - SQL Injection Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    h2 { margin-bottom: 4px; }
    input[type=text] { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { padding: 8px 16px; cursor: pointer; }
    #result { margin-top: 16px; padding: 10px; background: #f2f2f2; white-space: pre-wrap;
              font-family: monospace; font-size: 13px; border-radius: 4px; }
    .hint { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <p class="hint">Lab 4 - SQL Injection (Authentication Bypass)</p>

  <label>Username</label>
  <input type="text" id="username" placeholder="admin">

  <label>Password</label>
  <input type="text" id="password" placeholder="password">

  <p>
    <input type="checkbox" id="secure">
    <label for="secure">Use safe version (parameterized query)</label>
  </p>

  <button onclick="login()">Login</button>

  <p class="hint">Try in username box: <b>admin' --</b> &nbsp;or&nbsp; <b>' OR '1'='1' --</b></p>

  <div id="result">Result will show here</div>

  <script>
    function login() {
      fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          secure: document.getElementById('secure').checked
        })
      })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById('result').textContent =
          data.message + '\n\nSQL that ran:\n' + data.sql;
      });
    }
  </script>
</body>
</html>
